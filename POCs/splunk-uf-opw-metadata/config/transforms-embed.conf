# transforms.conf - embed Splunk S2S metadata into _raw before forwarding
# Used by both 8.x and 9.x transforms test VMs
#
# When sendCookedData=false, the Splunk S2S protocol strips all envelope
# metadata. Writing metadata into _raw here causes it to survive stripping
# because _raw IS the forwarded content.
#
# Applied via props.conf TRANSFORMS-embed-meta stanza on each UF.
# All 4 transforms are chained and run in order.

[embed-index]
SOURCE_KEY = _MetaData:Index
REGEX = ^(.+)$
DEST_KEY = _raw
FORMAT = $0 splunk_index="$1"

[embed-sourcetype]
SOURCE_KEY = MetaData:Sourcetype
REGEX = ^(.+)$
DEST_KEY = _raw
FORMAT = $0 splunk_sourcetype="$1"

[embed-source]
SOURCE_KEY = MetaData:Source
REGEX = ^(.+)$
DEST_KEY = _raw
FORMAT = $0 splunk_source="$1"

[embed-host]
SOURCE_KEY = MetaData:Host
REGEX = ^(.+)$
DEST_KEY = _raw
FORMAT = $0 splunk_host="$1"
