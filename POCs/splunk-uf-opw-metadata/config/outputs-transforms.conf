# outputs.conf for transforms test UFs (8.x and 9.x)
# Single output: OPW NLB only. sendCookedData=false (raw S2S) - the mode that
# strips metadata, which is what the transforms workaround is testing against.

[tcpout]
defaultGroup = via_op_worker
blockOnCloning = false

[tcpout:via_op_worker]
server = k8s-opw-opwobser-3935160e6a-d5e225d21e55d05c.elb.eu-west-1.amazonaws.com:9997
sendCookedData = false

useSSL = true
sslRootCAPath = /opt/splunkforwarder/etc/auth/poc-ca.crt
sslCertPath = /opt/splunkforwarder/etc/auth/uf-client.pem
sslPassword =

compressed = false
maxQueueSize = 500MB
dropEventsOnQueueFull = 300
writeTimeout = 60
useACK = false
