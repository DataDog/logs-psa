# =============================================================================
# Observability Pipelines Worker (OPW) Helm Values
# Target: 10 TB/day total volume (steady state ~7 TB/day, peak ~14 TB/day)
# Chart: datadog/observability-pipelines-worker (v2.20.5+)
# =============================================================================
#
# SIZING METHODOLOGY
# ------------------
# Conservative baseline: 1 TB/day per vCPU
#   - Equivalent to ~10 MiB/s per vCPU for ~512-byte unstructured log events
#   - Source: https://docs.datadoghq.com/observability_pipelines/scaling_and_performance/best_practices_for_scaling_observability_pipelines/
#
# Actual throughput varies significantly by pipeline complexity:
#
#   | Pipeline Tier                          | TB/day/vCPU | vs Basic |
#   |---------------------------------------|-------------|----------|
#   | Basic Processing (no SDS)             | 4.70        | baseline |
#   | Medium + SDS, targeted (10 rules)     | 3.61        | -23%     |
#   | Medium + SDS, blanket (10 rules)      | 2.95        | -37%     |
#   | Heavy + SDS, targeted (40 rules)      | 1.97        | -58%     |
#   | Heavy + SDS, blanket (40 rules)       | 0.79        | -83%     |
#
#   - SDS FIELD SCOPING is the single highest-leverage optimization:
#     targeting SDS to only PII-containing services (~20% of events)
#     can more than double throughput vs scanning all fields (+149%).
#   - SDS RULE SPLITTING delivers +45% throughput for high rule-count
#     pipelines: split >20 SDS rules into multiple processors
#     (e.g., 40 rules -> 2x20). This breaks Tokio FIFO head-of-line
#     blocking where a single large SDS processor starves other tasks.
#     At 4 vCPU with 40 unsplit rules, actual CPU utilization caps at
#     ~2.8 vCPU. Splitting into 2x20 recovers ~3.7 vCPU (+45%).
#   - Combined effect: splitting + scoping can recover most of the
#     SDS throughput penalty.
#
#
# CAPACITY CALCULATIONS (using conservative 1 TB/day per vCPU)
# ------------------------------------------------------------
# 10 TB/day is the TOTAL DAILY VOLUME.
# Log traffic follows a diurnal pattern with a 2x peak-to-trough ratio:
#   Steady state rate (0.7x): 7 TB/day = 81 MB/s (~57% of the day)
#   Peak rate (2x steady):    14 TB/day = 162 MB/s (~43% of the day)
#   Average across 24h:       10 TB/day
#
# Size the fleet for PEAK RATE, not the daily average.
#
# minReplicas: size for HA and steady state (7 TB/day)
#   = 7 vCPU at 100% utilization
#   = 10 vCPU at 70% target utilization
#   = 3 pods at 3.5 vCPU/pod (minimum HA recommendation)
#   3 pods x 3.5 vCPU = 10.5 vCPU -> 67% utilization at steady state
#   If one pod becomes unavailable, the two remaining pods can absorb
#   traffic until the replacement is ready.
#
# maxReplicas: size for peak (14 TB/day)
#   = 14 vCPU at 100% utilization
#   = 20 vCPU at 70% target utilization
#   = 6 pods at 3.5 vCPU/pod
#   6 pods x 3.5 vCPU = 21 vCPU capacity
#
#
# PEAK HANDLING STRATEGY
# ----------------------
# Peak traffic (14 TB/day) ramps over minutes as business hours begin.
# Handled by three layers:
#
#   1. MINIMUM REPLICAS (3 pods = 10.5 vCPU)
#      - At steady state (7 TB/day), 3 pods run at ~67% utilization
#      - Each pod has ~43% burst headroom (67% -> 100%)
#      - 3 pods at 100% = 10.5 vCPU, covers 10.5 TB/day
#
#   2. AGGRESSIVE HPA scaleUp (+100% per minute for small fleets)
#      - From 3 -> 6 pods in ~1 minute (small fleet, no stabilization)
#      - At T+1 min (6 pods), capacity exceeds peak at 70% target
#
#   3. UPSTREAM SENDER BUFFERING
#      - Senders (DD Agent, OTel Collector) MUST have retry and persistent
#        queues enabled. If OPW returns HTTP 503 during the brief initial
#        ramp, senders hold data locally and retry.
#      - OPW disk buffers protect against DESTINATION unavailability,
#        not source-side overload.
#
# See README.md for detailed timeline analysis and KEDA/DPA alternatives.
# =============================================================================


# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
image:
  repository: gcr.io/datadoghq
  name: observability-pipelines-worker
  # Pin to a specific version. Check `helm search repo datadog/observability-pipelines-worker`
  # before deploying to ensure you're on the latest chart version.
  # Review changelog: https://docs.datadoghq.com/observability_pipelines/guide/upgrade_worker/
  tag: "2.20.4"
  pullPolicy: IfNotPresent


# -----------------------------------------------------------------------------
# Datadog Configuration
# -----------------------------------------------------------------------------
datadog:
  # API key for telemetry reporting and remote pipeline configuration.
  # NEVER hardcode keys. Use an existing k8s Secret or Secrets Manager.
  apiKeyExistingSecret: "opw-api-key"
  # Pipeline ID from Datadog UI: Observability Pipelines > Pipelines > your pipeline.
  pipelineId: "<YOUR_PIPELINE_ID>"
  # Datadog site. Common values:
  #   datadoghq.com (US1), us3.datadoghq.com (US3), us5.datadoghq.com (US5),
  #   datadoghq.eu (EU1), ap1.datadoghq.com (AP1)
  site: "datadoghq.com"
  # Worker API provides /health endpoint, tap/top debugging, and admin gRPC.
  # Required for HTTP-based health probes and LB health checks.
  workerAPI:
    enabled: true


# -----------------------------------------------------------------------------
# Resource Requests and Limits
# -----------------------------------------------------------------------------
#
# WHY 3.5 vCPU PER POD:
#   - BINPACKING: 2 x 3.5 = 7.0 vCPU on an 8-vCPU node (c7i.2xlarge),
#     leaving 1.0 vCPU for kubelet, DaemonSets, and OS.
#     At cpu: "4", Kubernetes cannot fit 2 pods on an 8-vCPU node because
#     kubelet reservations + DaemonSets consume the remaining capacity.
#   - Smaller pods = finer-grained HPA scaling (each pod is a smaller unit)
#   - Better fault tolerance (losing 1 pod = less capacity loss)
#   - SDS-heavy pipelines show diminishing returns above 4 vCPU due to
#     Tokio FIFO task queue head-of-line (HOL) blocking
#   - Splitting rules into multiple SDS processors (e.g., 2x20) recovers
#     throughput lost to HOL blocking (+45%)
#   - Customers have reported improved SDS performance with smaller pods
#     (more horizontal scale, less HOL blocking)
#
# ALTERNATIVE: 3.0 vCPU per pod
#   If your DaemonSet footprint is larger than ~1.0 vCPU per node,
#   use cpu: "3.0" and memory: "6Gi" instead. This fits 2 pods on an
#   8-vCPU node with 2.0 vCPU remaining for overhead.
#   At 3.0 vCPU: minReplicas 4 (12 vCPU), maxReplicas 7 (21 vCPU).
#
# WHY NO CPU LIMIT:
#   - CPU limits cause CFS (Completely Fair Scheduler) throttling in Linux
#   - OPW is CPU-bound; CFS throttling creates artificial backpressure
#   - The official Helm chart intentionally omits CPU limits
#   - Without a CPU limit, pods can burst above requests when node has spare CPU
#
# WHY MEMORY LIMIT = REQUEST:
#   - Creates Guaranteed QoS class for the memory dimension
#   - Prevents OOMKill during burst buffering and backpressure events
#   - Avoids memory overcommit and protects against kubelet eviction
#     under node memory pressure
#   - Memory increases with the number of destinations (more batching/buffering)
#
resources:
  requests:
    cpu: "3.5"
    memory: "7Gi"    # 2 GiB per vCPU = 7 GiB for 3.5 vCPU (docs minimum ratio)
  limits:
    # No cpu limit - intentional. See WHY NO CPU LIMIT above.
    memory: "7Gi"    # Match request for Guaranteed QoS on memory dimension


# -----------------------------------------------------------------------------
# Autoscaling (HPA)
# -----------------------------------------------------------------------------
#
# CPU-based HPA is the Datadog-documented default autoscaling approach.
# For pipelines with heavy SDS usage (20+ rules), use KEDA or DPA instead.
# See README.md "KEDA Alternative" and "Datadog Pod Autoscaler" sections.
#
# KNOWN ISSUE: CPU-BASED HPA FAILURE MODE WITH SDS
#   When SDS saturates, CPU DROPS because workers idle-block waiting for
#   SDS to drain the processing queue. HPA interprets falling CPU as
#   surplus capacity and SCALES DOWN - exactly when it should scale up.
#
# ALSO: pipelines.utilization is NOT a reliable backpressure signal.
#   OPW engineering: "not a good indicator of backpressure, because if a
#   buffer fills up and the pipeline stalls, every component will have a
#   utilization of 0."
#
autoscaling:
  enabled: true

  # MIN REPLICAS:
  #   Steady state: 7 TB/day / 1 TB/vCPU = 7 vCPU at 100% utilization
  #   At 70% target: 10 vCPU -> 3 pods at 3.5 vCPU (minimum HA recommendation)
  #   3 pods x 3.5 vCPU = 10.5 vCPU -> 67% utilization at steady state
  #   If one pod becomes unavailable, the two remaining pods can absorb
  #   the 7 TB/day steady-state traffic.
  #   NOTE: At higher volumes, size the minimum to your off-hours baseline.
  minReplicas: 3

  # MAX REPLICAS:
  #   Peak: 14 TB/day / 1 TB/vCPU = 14 vCPU at 100%
  #   At 70% target: 20 vCPU -> 6 pods at 3.5 vCPU
  #   6 pods x 3.5 vCPU = 21 vCPU capacity
  #   IMPORTANT: Your node pool / ASG MUST have capacity for 21 vCPU.
  #   On c7i.2xlarge (8 vCPU, 2 pods/node): 3 nodes.
  #   Pre-warm or use Karpenter/Cluster Autoscaler with sufficient limits.
  maxReplicas: 6

  # TARGET CPU UTILIZATION:
  #   70% provides 30% burst headroom per pod.
  #   WHY 70% NOT 60%:
  #     - 60% is appropriate for large fleets (100+ TB/day) where the blast
  #       radius of a capacity gap is higher
  #     - 70% is appropriate for small/medium fleets (10-50 TB/day) where
  #       the cost of running at 60% is proportionally higher
  #     - For cost optimization: increase toward 80% after observing stable
  #       behavior. Do not exceed 80%.
  #   Source: https://docs.datadoghq.com/observability_pipelines/scaling_and_performance/best_practices_for_scaling_observability_pipelines/
  targetCPUUtilizationPercentage: 70

  # HPA BEHAVIOR:
  #   Asymmetric: scale UP aggressively, scale DOWN conservatively.
  #   Prevents thrashing during bursty traffic patterns.
  #
  #   SMALL FLEET PATTERN (this config, <20 pods):
  #     - stabilizationWindowSeconds: 0 (immediate, K8s default)
  #     - Percent: 100 (reach maxReplicas in one step)
  #     - Cost of one false-positive scale-up: one extra pod (negligible)
  #     - Benefit: no backpressure or 503s during traffic spikes
  #
  #   WHEN TO SWITCH TO LARGE FLEET PATTERN (20+ pods):
  #     Uncomment the large-fleet alternative below and comment out the
  #     small-fleet config. At larger scale, unnecessary scale events are
  #     expensive (node provisioning, PVC creation, NLB target registration).
  #
  behavior:
    scaleUp:
      # SMALL FLEET: 0s stabilization, immediate reaction.
      # Cost of one unnecessary scale-up (one pod) is negligible.
      stabilizationWindowSeconds: 0
      policies:
        # SMALL FLEET: Percent 100 reaches maxReplicas in one step.
        #   At 3 pods: +3 = 6 pods (maxReplicas). Done in one cycle.
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
      #
      # LARGE FLEET ALTERNATIVE (uncomment when fleet exceeds ~20 pods):
      # stabilizationWindowSeconds: 60
      # policies:
      #   - type: Percent
      #     value: 50
      #     periodSeconds: 60
      #   # Absolute floor: scale proportionally with fleet size.
      #   # At 40 pods, 50% = 20. Adjust floor upward for larger fleets.
      #   - type: Pods
      #     value: 20
      #     periodSeconds: 60
      # selectPolicy: Max

    scaleDown:
      # 15-minute (900s) window prevents oscillation common with
      # bursty log traffic (cron jobs, deploy spikes).
      stabilizationWindowSeconds: 900
      policies:
        # SLOW SCALE-DOWN: remove at most 10% of pods per period.
        #   From 6: 6 -> 5 -> 4 -> 3 (~5 min to return to min)
        #   Intentionally conservative: excess capacity is cheap, data loss is not.
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min


# -----------------------------------------------------------------------------
# Persistence (Disk Buffers)
# -----------------------------------------------------------------------------
#
# Disk buffers provide destination failure resilience. Without them, any
# destination outage could cause data loss.
#
# IMPORTANT DISTINCTION:
#   Disk buffers sit at the DESTINATION (sink), not the source.
#   They protect against DESTINATION unavailability (API outage, rate limiting).
#   They do NOT protect against SOURCE-SIDE overload during traffic spikes.
#   Source-side protection comes from:
#     1. High minReplicas (burst headroom)
#     2. Aggressive HPA scaling
#     3. Upstream sender retry/persistent queues (DD Agent, OTel Collector)
#
# The disk buffer max_size is configured separately in the pipeline config
# (Terraform: datadog_observability_pipeline resource, or DD UI).
# The PVC size here MUST be larger than the pipeline's max_size.
#
# ENOSPC WARNING:
#   If a disk buffer volume reaches 100% capacity, partial writes can corrupt
#   the buffer. OPW will loop attempting to drain, emitting 'Events dropped'
#   with 'unprocessable_events' errors. Always provision the PVC at least 10%
#   larger than the pipeline's configured max_size. Monitor
#   pipelines.data_dir_available_bytes and alert when free space drops below
#   15% of capacity.
#
persistence:
  enabled: true
  # Match your cloud provider's performant block storage:
  #   AWS:   gp3        (3,000 baseline IOPS, 125 MB/s throughput)
  #   GCP:   premium-rwo or hyperdisk-balanced
  #   Azure: managed-csi-premium
  # Avoid gp2 (burstable IOPS). Avoid HDD classes.
  storageClassName: "gp3"
  accessModes:
    - ReadWriteOnce

  # PVC SIZE:
  #   Must be larger than the pipeline disk buffer max_size.
  #   40 GiB = ~36 GiB max_size + 10% filesystem overhead.
  #
  #   36 GiB buffer provides ~20 min of runway at full pod throughput:
  #     36 GiB / (35 MB/s per pod at 3.5 vCPU) = ~1,075s = ~18 min
  #   For longer destination outages, increase proportionally.
  #
  #   FORMULA: total_buffer = throughput_per_worker * seconds_of_runway
  #     At 10 MiB/s/vCPU, 3.5 vCPU, 10 min runway: 35 * 600 = 21 GB
  #     At 10 MiB/s/vCPU, 3.5 vCPU, 20 min runway: 35 * 1200 = 42 GB
  #
  size: 40Gi

  # RETENTION POLICY:
  #   Retain PVCs on scale-down and delete to prevent data loss.
  #   Without Retain, HPA scale-down orphans PVCs with undrained buffer data = data loss.
  #   See Termination Grace Period below for graceful shutdown timing and buffer drain.
  retentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain


# -----------------------------------------------------------------------------
# Termination Grace Period
# -----------------------------------------------------------------------------
#
# OPW needs time to drain disk buffers during graceful shutdown.
# The Helm chart derives DD_OP_GRACEFUL_SHUTDOWN_LIMIT_SECS = this value - 10.
# So 310 - 10 = 300s for OPW to drain, then SIGKILL at 310s.
# Supported since OPW 2.19.0.
#
# When OPW receives SIGTERM:
#   1. Health API marked not-serving (Kubernetes stops routing traffic)
#   2. HTTP sources stop accepting new connections
#   3. In-flight requests complete
#   4. Transforms drain as input channels close
#   5. Sinks flush remaining events to destinations
#   6. OPW exits
#
# Drain only covers events already in the pipeline at SIGTERM, not live ingest.
# A second SIGTERM during shutdown triggers immediate exit.
#
# For a 36 GiB buffer at ~54 MB/s drain rate (observed at 2+ vCPU):
#   drain time = ~11 minutes. 300s covers most scenarios.
#   Undrained data persists on PVC via retentionPolicy.
#
# For larger disk buffers, increase proportionally:
#   50 GiB -> 600s, 100 GiB -> 1200s
#
terminationGracePeriodSeconds: 310


# -----------------------------------------------------------------------------
# Pod Management Policy
# -----------------------------------------------------------------------------
#
# Parallel: all pods start/stop simultaneously.
#   PRO:  Fast HPA scale-up - critical for handling peak transitions
#   CON:  Multi-Attach errors during rolling updates with ReadWriteOnce PVCs
#         (new pod scheduled before old terminates; different node = volume conflict)
#
# DECISION: Use Parallel for spike handling. Mitigate rolling update issue by:
#   1. Scale down to minReplicas before helm upgrade
#   2. Use updateStrategy.rollingUpdate.maxUnavailable to limit churn
#   3. Or: delete StatefulSet with --cascade=orphan, then helm upgrade
#
# AZURE/AKS NOTE: This issue is more common on AKS due to different scheduling
# behavior. If you experience persistent Multi-Attach errors on AKS, test with
# OrderedReady and evaluate whether the slower scale-up is acceptable for your
# traffic patterns.
#
podManagementPolicy: Parallel


# -----------------------------------------------------------------------------
# Pod Disruption Budget
# -----------------------------------------------------------------------------
#
# At 10 TB/day with 3 pods, losing too many pods simultaneously risks data loss.
# minAvailable: 2 ensures at least 2 pods are always running.
# At 3 pods: only 1 can be disrupted at once.
# At 6 pods (during peak): 4 can be disrupted (6 - 2 = 4).
#
podDisruptionBudget:
  enabled: true
  minAvailable: 2


# -----------------------------------------------------------------------------
# Update Strategy
# -----------------------------------------------------------------------------
#
# Rolling update with maxUnavailable: 1.
# At 3 pods, 1 pod is updated at a time.
# This is more conservative than the 10% used at 100TB/300TB scale
# because each pod represents a larger fraction of total capacity.
#
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1


# -----------------------------------------------------------------------------
# Service Configuration
# -----------------------------------------------------------------------------
#
# Use L4 (Network Load Balancer), NOT L7 (ALB/Ingress).
# Datadog docs explicitly recommend L4 for OPW for performance and simplicity.
# Client-side load balancing is NOT recommended.
# Source: https://docs.datadoghq.com/observability_pipelines/scaling_and_performance/best_practices_for_scaling_observability_pipelines/
#
# LOAD BALANCER DISTRIBUTION:
#   Cloud NLBs use flow hash (5-tuple), NOT round-robin.
#   OPW automatically recycles connections every ~5 min (300s + 10% jitter).
#   This is built-in and not configurable via the OP pipeline UI.
#
service:
  enabled: true
  # LoadBalancer for sources outside the cluster.
  # Use ClusterIP if all sources are cluster-internal.
  type: LoadBalancer
  annotations:
    # AWS NLB annotations. Adjust for your cloud provider:
    #   GCP: cloud.google.com/l4-rbs: "enabled"
    #   Azure: service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    # CROSS-ZONE: Enable for even distribution across OPW pods.
    # Uneven pod-per-AZ distribution is common during scaling events.
    # AWS charges ~$0.01/GB for cross-zone data transfer.
    # At 10 TB/day: ~$2K/month cross-zone cost.
    # If cost is prohibitive, enforce strict even pod distribution across AZs
    # using topologySpreadConstraints with whenUnsatisfiable: DoNotSchedule
    # (hard constraint) before disabling cross-zone.
    # GCP and Azure: cross-zone is default and free.
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  # Adjust port to match your source type:
  #   8282 for http_server/datadog_agent, 9997 for splunk_tcp,
  #   4317 for OTel gRPC, 4318 for OTel HTTP, 514 for syslog
  ports:
    - name: http-input
      port: 8282
      targetPort: 8282
      protocol: TCP


# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  # SOURCE ADDRESS (adjust for your source type):
  #   DD_OP_SOURCE_HTTP_SERVER_ADDRESS for http_server
  #   DD_OP_SOURCE_DATADOG_AGENT_ADDRESS for datadog_agent
  #   DD_OP_SOURCE_SPLUNK_TCP_ADDRESS for splunk_tcp
  #   Bind to 0.0.0.0 to accept connections from the load balancer/service.
  - name: DD_OP_SOURCE_HTTP_SERVER_ADDRESS
    value: "0.0.0.0:8282"

  # JEMALLOC MEMORY ALLOCATOR TUNING:
  #   Forces jemalloc to return pages to the OS more aggressively:
  #     thp:never          - Disable transparent huge pages (reduces fragmentation)
  #     dirty_decay_ms=1000 - Return dirty pages after 1s (default: 10s)
  #     muzzy_decay_ms=1000 - Return muzzy pages after 1s (default: 10s)
  #   High RSS after bursts is allocator behavior, not a memory leak.
  - name: MALLOC_CONF
    value: "thp:never,dirty_decay_ms:1000,muzzy_decay_ms:1000"

  # LOG LEVEL:
  #   info is the production default. Use debug only for troubleshooting.
  #   warn/error miss "Source send cancelled" backpressure warnings.
  - name: VECTOR_LOG
    value: "info"


# -----------------------------------------------------------------------------
# Container Ports
# -----------------------------------------------------------------------------
containerPorts:
  - name: http-input
    containerPort: 8282
    protocol: TCP
  - name: worker-api
    containerPort: 8686
    protocol: TCP


# -----------------------------------------------------------------------------
# Pod Scheduling
# -----------------------------------------------------------------------------
#
# At 10 TB/day with 3 pods, each pod handles ~33% of traffic.
# Losing one pod is recoverable (2 surviving pods absorb within 36s).
# Spreading across AZs and nodes limits blast radius.
#
topologySpreadConstraints:
  # Even spread across availability zones.
  # maxSkew: 1 for small fleets. Use maxSkew: 2 for fleets over 50 pods.
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: observability-pipelines-worker
  # Even spread across nodes within each zone
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: observability-pipelines-worker

# Soft anti-affinity: prefer not co-locating OPW pods on the same node.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: observability-pipelines-worker
          topologyKey: kubernetes.io/hostname

# DEDICATED NODE POOL (recommended):
#   Instance recommendations (3.5 vCPU OPW pods):
#     AWS:   c7i.2xlarge (8 vCPU, 16 GiB) = 2 pods/node (recommended)
#            c7i.4xlarge (16 vCPU, 32 GiB) = 4 pods/node
#     GCP:   c2-standard-8 (8 vCPU, 32 GiB) = 2 pods/node
#            c4a-standard-8 (Axion, ARM64, cost-efficient) = 2 pods/node
#     Azure: F8s_v2 (8 vCPU, 16 GiB) = 2 pods/node
#   2 pods/node on 8-vCPU instances is optimal: 2 x 3.5 = 7.0 vCPU requested,
#   leaving 1.0 vCPU for kubelet + DaemonSets + OS.
#   Use non-burstable instances. OPW is CPU-bound.
#   At 6 pods on c7i.2xlarge (2 pods/node): 3 nodes.
#
# nodeSelector:
#   nodepool: opw
#
# tolerations:
#   - key: "dedicated"
#     operator: "Equal"
#     value: "opw"
#     effect: "NoSchedule"


# -----------------------------------------------------------------------------
# Pod Labels and Annotations
# -----------------------------------------------------------------------------
podLabels:
  app.kubernetes.io/part-of: observability-pipelines

# podAnnotations: {}


# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: opw-worker
  annotations: {}
  # For AWS IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/opw-role
  # For GCP Workload Identity:
  #   iam.gke.io/gcp-service-account: opw@PROJECT.iam.gserviceaccount.com


# -----------------------------------------------------------------------------
# Common Labels (applied to all Helm-managed resources)
# -----------------------------------------------------------------------------
commonLabels:
  team: "platform"
  environment: "production"


# =============================================================================
# KEDA / DPA ALTERNATIVE (not a Helm chart value - deploy separately)
# =============================================================================
#
# If using KEDA or Datadog Pod Autoscaler instead of HPA, set:
#   autoscaling.enabled: false
# and deploy a KEDA ScaledObject or DPA DatadogPodAutoscaler targeting the
# OPW StatefulSet.
#
# See README.md for the full KEDA ScaledObject manifest and metric guidance.
#
# Recommended scaling metric:
#   pipelines.source_buffer_utilization_mean
#   This metric RISES during backpressure (unlike CPU which can DROP
#   during SDS saturation).
#   IMPORTANT: reports raw event counts, NOT 0-1 ratio.
#   Max value = vCPU x 1000. For 3.5-vCPU pods: max = 3500.
#   Scale trigger at avg > 1750 (50% of capacity) over 2 min.
# =============================================================================
